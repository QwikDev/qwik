# Build and test everything
#
# Everything that gets built or tested on Linux is a Nix derivation, see nix/ci.nix.
# A derivation's hash covers exactly its inputs, so "does this need to run?" is "is its output
# in the build cache?". The plan job asks that for every output and the jobs after it only run
# what is missing. Windows and macOS have no Nix: their jobs test the packages the Linux build
# uploads, and skip when a marker keyed by the same hashes says they passed before.
#
# NOTE: only use pnpm run scripts for build commands
# This way we're sure that dev and CI environments are consistent

name: Qwik CI

# PRs cancel stale runs. Branch pushes queue instead, so merges that land during a run are
# tested together by the next one. Manual releases never share a queue, or a push could drop them.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
  push:
    branches:
      - main
      - upcoming
      - next
      - vercelserverless
      - 'build/**'
  workflow_dispatch:
    inputs:
      disttag:
        description: 'On main, "latest" and "next" stamp the build with the version number committed in package.json; "dev" adds -dev to it unless npm lacks that version.'
        required: true
        type: choice
        default: 'dev'
        options:
          - dev
          - next
          - latest

env:
  # Disable incremental build, speeds up CI
  CARGO_INCREMENTAL: 0
  # Only the jobs without Nix use these; the Nix builds take Node from the flake.
  CI_NODE_VERSION: 24.15.0
  CI_NODE_VERSION_E2E: 22.22.2

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets Nix sign in to FlakeHub Cache.
      id-token: write
    outputs:
      ci: ${{ steps.plan.outputs.ci }}
      builds: ${{ steps.plan.outputs.builds }}
      checks: ${{ steps.plan.outputs.checks }}
      docs-checks: ${{ steps.plan.outputs.docs-checks }}
      out-paths: ${{ steps.plan.outputs.out-paths }}
      key-docs: ${{ steps.plan.outputs.key-docs }}
      deploy-docs: ${{ !startsWith(steps.docs-uploaded.outputs.cache-matched-key, format('docs-uploaded-{0}-', steps.plan.outputs.key-docs)) }}
      key-optimizer: ${{ steps.plan.outputs.key-optimizer }}
      key-unit: ${{ steps.plan.outputs.key-unit }}
      key-e2e: ${{ steps.plan.outputs.key-e2e }}
      key-cli-e2e: ${{ steps.plan.outputs.key-cli-e2e }}
      test-unit: ${{ steps.unit-passed.outputs.cache-hit != 'true' }}
      test-e2e: ${{ steps.e2e-passed.outputs.cache-hit != 'true' }}
      test-cli-e2e: ${{ steps.cli-e2e-passed.outputs.cache-hit != 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # A PR is checked out merged; the commit before that is what it is compared to.
          fetch-depth: 2

      - uses: ./.github/actions/nix

      - name: Find what is not built yet
        id: plan
        env:
          DISPATCHED_TAG: ${{ github.event.inputs.disttag }}
        run: |
          # Release builds stamp the plain version, all others a -dev one. A main run releases
          # when asked to, or when it holds a version that npm lacks: changesets then publishes it.
          flavor=dev
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            case "$DISPATCHED_TAG" in next | latest) flavor=latest ;; esac
            for package in packages/qwik packages/optimizer packages/create-qwik; do
              published=$(jq -r '"https://registry.npmjs.org/\(.name)/\(.version)"' "$package/package.json")
              case "$(curl -s --retry 3 --max-time 30 -o /dev/null -w '%{http_code}' "$published")" in
                200) ;;
                404) flavor=latest ;;
                *)
                  echo "::error::Could not ask npm whether $published exists"
                  exit 1
                  ;;
              esac
            done
          fi
          outPaths='builtins.mapAttrs (_: builtins.mapAttrs (_: drv: drv.outPath))'
          nix eval --json ".#ci.$flavor" --apply "$outPaths" > paths.json

          # An output that substitutes without building is in the cache: nothing to run for it.
          missing() {
            jq -r "$1 | to_entries[] | \"\(.key) \(.value)\"" paths.json | while read -r name path; do
              nix build --no-link --max-jobs 0 "$path" < /dev/null 2> /dev/null || echo "$name"
            done | jq -Rnc '[inputs]'
          }
          checks=$(missing .checks)
          # node_modules is large and dist only repackages the others, so neither is fetched to find out.
          builds=$(missing '.packages | del(.["node-modules"], .dist)')
          # Nix does not know how the other platforms get tested, so their caches also depend on this.
          platform=$(cat .github/workflows/ci.yml .github/actions/built-checkout/action.yml | sha256sum | cut -c 1-16)

          {
            echo "ci=.#ci.$flavor"
            echo "builds=$builds"
            echo "checks=$(jq -c 'map(select(startswith("e2e-docs-") | not))' <<< "$checks")"
            echo "docs-checks=$(jq -c 'map(select(startswith("e2e-docs-")))' <<< "$checks")"
            echo "out-paths=$(jq -c '[.[][]]' paths.json)"
            # Every branch deploys to its own site, and a PR previews against its base.
            jq -r '"key-docs=\($target)-\(.packages.docs | ltrimstr("/nix/store/"))"' --arg target "${GITHUB_BASE_REF:-$GITHUB_REF_NAME}" paths.json
            # The other platforms key their caches on what the matching Linux output is made from.
            jq -r '{
              optimizer: .packages.optimizer,
              unit: .checks.unit,
              e2e: .checks["e2e-chromium-ts-1of2"],
              "cli-e2e": .checks["e2e-adapters-ts-node-1of2"]
            } | to_entries[] | "key-\(.key)=\(.value | ltrimstr("/nix/store/"))-\($platform)"' --arg platform "$platform" paths.json
          } | tee -a "$GITHUB_OUTPUT"

          # Not reproducible and cached by its inputs: builds after the merge reuse what this run installs.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base=$(nix eval --raw "github:$GITHUB_REPOSITORY/$(git rev-parse HEAD^1)#ci.$flavor.packages.node-modules.outPath" || true)
            if [ -n "$base" ] && [ "$base" != "$(jq -r '.packages["node-modules"]' paths.json)" ]; then
              echo "::warning title=node_modules changes::This PR installs different dependencies. Review them: once merged, later builds reuse the node_modules that this PR's run installed."
            fi
          fi

      # The Nix cache is shared between branches, so "built" does not mean "deployed from here".
      # Branch runs save a marker per upload, which PR runs cannot write. The docs deploy unless
      # the newest marker is for these docs, so going back to earlier docs deploys them again.
      - name: 'check marker: docs uploaded for deployment'
        id: docs-uploaded
        uses: actions/cache/restore@v5
        with:
          lookup-only: true
          path: docs-uploaded.txt
          # Never an exact match: restore-keys finds the newest marker.
          key: docs-uploaded-${{ steps.plan.outputs.key-docs }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: docs-uploaded-${{ github.base_ref || github.ref_name }}-

      - name: 'check marker: unit tests passed on the other platforms'
        id: unit-passed
        uses: actions/cache/restore@v5
        with:
          lookup-only: true
          path: tests-passed.txt
          key: tests-passed-unit-${{ steps.plan.outputs.key-unit }}
      - name: 'check marker: e2e tests passed on the other platforms'
        id: e2e-passed
        uses: actions/cache/restore@v5
        with:
          lookup-only: true
          path: tests-passed.txt
          key: tests-passed-e2e-${{ steps.plan.outputs.key-e2e }}
      - name: 'check marker: cli e2e tests passed on the other platforms'
        id: cli-e2e-passed
        uses: actions/cache/restore@v5
        with:
          lookup-only: true
          path: tests-passed.txt
          key: tests-passed-cli-e2e-${{ steps.plan.outputs.key-cli-e2e }}

  ############ BUILD PACKAGES ############
  build:
    name: Build Packages
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # The optimizer with its Linux binding and wasm, qwik, and the other packages.
      - uses: ./.github/actions/nix
        with:
          build: ${{ needs.plan.outputs.ci }}.packages.dist
          # PR runs can write the shared cache. What a branch publishes is built here instead.
          from-source: ${{ github.event_name != 'pull_request' }}

      - name: Stage the packages
        run: mkdir artifact-dist && cp -r --no-preserve=mode,ownership result/. artifact-dist

      - name: Upload packages artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: artifact-dist
          include-hidden-files: true
          path: artifact-dist/
          if-no-files-found: error

  ############ BUILD PLATFORM BINDINGS ############
  build-bindings:
    name: Build optimizer ${{ matrix.settings.target }}
    needs: plan
    strategy:
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin

          - host: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.settings.host }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Platform binding cache
        id: cache
        uses: actions/cache@v5
        with:
          path: packages/optimizer/bindings
          key: bindings-${{ matrix.settings.target }}-${{ needs.plan.outputs.key-optimizer }}

      - name: Install Rust toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: steps.cache.outputs.cache-hit != 'true'
      - name: Setup Node
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-*.yaml
          registry-url: https://registry.npmjs.org/

      - if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm install

      - name: Build Platform Binding
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm build --platform-binding

      - name: Upload Platform Binding Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: artifact-bindings-${{ matrix.settings.target }}
          include-hidden-files: true
          path: packages/optimizer/bindings
          if-no-files-found: error

  ############ BUILD DOCS ############
  build-docs:
    name: Build Docs
    needs:
      - plan
      - build
    if: |
      !cancelled() && needs.build.result == 'success' && (
        needs.plan.outputs.deploy-docs == 'true' ||
        contains(fromJSON(needs.plan.outputs.builds), 'docs')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/nix
        with:
          build: ${{ needs.plan.outputs.ci }}.packages.docs

      - name: Stage the docs
        if: needs.plan.outputs.deploy-docs == 'true'
        env:
          # The host deploy-docs.yml publishes a PR preview to.
          PREVIEW_ORIGIN: ${{ github.event_name == 'pull_request' && format('https://pr-{0}.qwik-8nx.pages.dev', github.event.pull_request.number) || '' }}
        run: |
          cp -r --no-preserve=mode,ownership result/packages/docs artifact-docs
          # PRs share one docs build, so a preview gets its absolute URLs (canonical, social images) here.
          if [ -n "$PREVIEW_ORIGIN" ]; then
            grep -rlZ 'https://next.qwik.dev' artifact-docs/dist | xargs -0 -r sed -i "s#https://next.qwik.dev#$PREVIEW_ORIGIN#g"
          fi

      # deploy-docs.yml deploys this
      - name: Save Docs Artifacts
        if: needs.plan.outputs.deploy-docs == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: artifact-docs
          include-hidden-files: true
          path: |
            artifact-docs/dist
            artifact-docs/server
          if-no-files-found: error

      # Not on PRs: docs that differ from the base's get a preview on every push, so a run that
      # is cancelled before it deploys does not leave the preview behind.
      - name: Mark the docs as uploaded
        if: needs.plan.outputs.deploy-docs == 'true' && github.event_name != 'pull_request'
        run: echo ok > docs-uploaded.txt
      - name: Save docs marker
        if: needs.plan.outputs.deploy-docs == 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@v5
        with:
          key: docs-uploaded-${{ needs.plan.outputs.key-docs }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs-uploaded.txt

  ############ LINUX TESTS ############
  # Unit tests, benchmarks, lint, the Insights build and every e2e suite: one job per check that is not cached.
  check:
    timeout-minutes: 60
    name: ${{ matrix.check }}
    needs:
      - plan
      - build
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.plan.outputs.checks != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.plan.outputs.checks) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/nix
        with:
          build: ${{ needs.plan.outputs.ci }}.checks.${{ matrix.check }}
          results-name: test-results-${{ matrix.check }}

  check-docs:
    timeout-minutes: 30
    name: ${{ matrix.check }}
    needs:
      - plan
      - build
      - build-docs
    # build-docs is skipped when the docs are already built.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build-docs.result != 'failure' && needs.plan.outputs.docs-checks != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.plan.outputs.docs-checks) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/nix
        with:
          build: ${{ needs.plan.outputs.ci }}.checks.${{ matrix.check }}
          results-name: test-results-${{ matrix.check }}

  ############ CACHE FOR FORK PRS ############
  # Fork PRs cannot reach FlakeHub Cache. They read the GitHub cache, which only this job fills,
  # so that no job that others wait for spends time on the upload.
  fill-fork-cache:
    name: Fill the cache for fork PRs
    # A convenience for forks: it must not fail the run or hold up the next one.
    continue-on-error: true
    timeout-minutes: 15
    needs:
      - plan
      - build
      - build-docs
      - check
      - check-docs
    # A fork's own runs write the GitHub cache in every job already.
    if: ${{ !cancelled() && github.repository == 'QwikDev/qwik' && github.event_name != 'pull_request' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/nix
        with:
          fork-cache: true

      # shortcut: re-uploads every output each run, dedupe if the cache quota gets tight
      - name: Fetch every output that is built
        env:
          OUT_PATHS: ${{ needs.plan.outputs.out-paths }}
        run: |
          # A check that did not pass has no output: it stays missing.
          jq -r '.[]' <<< "$OUT_PATHS" | while read -r path; do
            nix build --no-link --max-jobs 0 "$path" < /dev/null 2> /dev/null ||
              echo "::warning::Not in the build cache, so not copied: $path"
          done

  ############ UNIT TEST ############
  test-unit:
    name: Unit Tests (windows-latest)
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build-bindings.result == 'success' && needs.plan.outputs.test-unit == 'true' }}
    runs-on: windows-latest
    needs:
      - plan
      - build
      - build-bindings

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/built-checkout
        with:
          node-version: ${{ env.CI_NODE_VERSION }}

      - name: Unit Tests
        run: pnpm run test.unit

  ############ E2E TEST ############
  test-e2e:
    # Sometimes the tests just hang
    timeout-minutes: 20
    name: E2E Tests (${{ matrix.settings.host }}, ${{ matrix.settings.browser }}, shard ${{ matrix.settings.shard }}/${{ matrix.settings.shardTotal }})
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build-bindings.result == 'success' && needs.plan.outputs.test-e2e == 'true' }}

    needs:
      - plan
      - build
      - build-bindings

    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: windows-latest
            browser: chromium
            shard: 1
            shardTotal: 2
          - host: windows-latest
            browser: chromium
            shard: 2
            shardTotal: 2
          - host: macos-latest
            browser: webkit
            shard: 1
            shardTotal: 4
          - host: macos-latest
            browser: webkit
            shard: 2
            shardTotal: 4
          - host: macos-latest
            browser: webkit
            shard: 3
            shardTotal: 4
          - host: macos-latest
            browser: webkit
            shard: 4
            shardTotal: 4
    runs-on: ${{ matrix.settings.host }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/built-checkout
        with:
          node-version: ${{ env.CI_NODE_VERSION_E2E }}
          browser: ${{ matrix.settings.browser }}

      - name: Playwright E2E Tests
        run: pnpm exec playwright test e2e/qwik-e2e/tests --browser=${{ matrix.settings.browser }} --config=e2e/qwik-e2e/playwright.config.ts --shard=${{ matrix.settings.shard }}/${{ matrix.settings.shardTotal }}

      - name: Upload Playwright Trace
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure() # only when tests fail
        with:
          name: playwright-report-${{ matrix.settings.host }}-${{ matrix.settings.browser }}-${{ matrix.settings.shard }}-${{ matrix.settings.shardTotal }}
          path: test-results/
          retention-days: 30

  test-cli-e2e:
    timeout-minutes: 30
    name: E2E CLI Tests (${{ matrix.settings.host }}, ${{ matrix.settings.browser }}, shard ${{ matrix.settings.shard }}/${{ matrix.settings.shardTotal }})
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build-bindings.result == 'success' && needs.plan.outputs.test-cli-e2e == 'true' }}

    needs:
      - plan
      - build
      - build-bindings

    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            browser: webkit
            run-cli: true
            shard: 1
            shardTotal: 1
            cliShard: 1
            cliShardTotal: 1
          - host: windows-latest
            browser: chromium
            run-cli: true
            shard: 1
            shardTotal: 4
            cliShard: 1
            cliShardTotal: 2
          - host: windows-latest
            browser: chromium
            run-cli: true
            shard: 2
            shardTotal: 4
            cliShard: 2
            cliShardTotal: 2
          - host: windows-latest
            browser: chromium
            run-cli: false
            shard: 3
            shardTotal: 4
          - host: windows-latest
            browser: chromium
            run-cli: false
            shard: 4
            shardTotal: 4
    runs-on: ${{ matrix.settings.host }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/built-checkout
        with:
          node-version: ${{ env.CI_NODE_VERSION_E2E }}
          browser: ${{ matrix.settings.browser }}

      - name: Playwright E2E Integration Tests
        run: pnpm exec playwright test e2e/adapters-e2e/tests --project=${{ matrix.settings.browser }} --config=e2e/adapters-e2e/playwright.config.ts --shard=${{ matrix.settings.shard }}/${{ matrix.settings.shardTotal }}

      - name: Playwright E2E Qwik React Tests
        run: pnpm exec playwright test e2e/qwik-react-e2e/tests --project=${{ matrix.settings.browser }} --config=e2e/qwik-react-e2e/playwright.config.ts --shard=${{ matrix.settings.shard }}/${{ matrix.settings.shardTotal }}

      - name: CLI E2E Tests
        if: matrix.settings.run-cli
        run: pnpm --filter qwik-cli-e2e exec vitest run --config=vite.config.ts --shard=${{ matrix.settings.cliShard }}/${{ matrix.settings.cliShardTotal }}
        env:
          PW_BROWSER: ${{ matrix.settings.browser }}

  # Linux results are cached by Nix. These markers do the same for the other platforms.
  mark-tests-passed:
    name: Save Passed Test Markers
    runs-on: ubuntu-latest
    needs:
      - plan
      - test-unit
      - test-e2e
      - test-cli-e2e
    if: ${{ !cancelled() && needs.plan.result == 'success' }}

    steps:
      - run: echo ok > tests-passed.txt

      - name: Save unit tests marker
        if: needs.test-unit.result == 'success'
        uses: actions/cache/save@v5
        with:
          key: tests-passed-unit-${{ needs.plan.outputs.key-unit }}
          path: tests-passed.txt

      - name: Save e2e tests marker
        if: needs.test-e2e.result == 'success'
        uses: actions/cache/save@v5
        with:
          key: tests-passed-e2e-${{ needs.plan.outputs.key-e2e }}
          path: tests-passed.txt

      - name: Save cli e2e tests marker
        if: needs.test-cli-e2e.result == 'success'
        uses: actions/cache/save@v5
        with:
          key: tests-passed-cli-e2e-${{ needs.plan.outputs.key-cli-e2e }}
          path: tests-passed.txt

  ############ RELEASE ############
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write

    needs:
      - plan
      - build
      - build-bindings
      - check
      - test-unit
      - test-e2e
      - test-cli-e2e
    # the tests run when any package changes, so we have to release
    # on "upcoming", we always check if we have something to release
    # don't run on forks
    if: |
      !cancelled() && 
      github.event_name != 'pull_request' &&
      github.repository == 'QwikDev/qwik' && (
        github.ref == 'refs/heads/main' ||
        needs.check.result == 'success' || 
        needs.check.result == 'skipped'
      )

    steps:
      - name: Verify prerequisites
        if: |
          !(
            needs.build.result == 'success' &&
            needs.build-bindings.result == 'success' &&
            (
              needs.check.result == 'success' ||
              needs.check.result == 'skipped'
            ) &&
            (
              needs.test-unit.result == 'success' ||
              needs.test-unit.result == 'skipped'
            ) &&
            (
              needs.test-e2e.result == 'success' ||
              needs.test-e2e.result == 'skipped'
            ) &&
            (
              needs.test-cli-e2e.result == 'success' ||
              needs.test-cli-e2e.result == 'skipped'
            )
          )
        run: exit 1

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/built-checkout
        with:
          node-version: ${{ env.CI_NODE_VERSION }}

      # Do this before other release steps to avoid
      # publishing temporary files
      - name: Create Release Pull Request or Publish to npm
        if: github.ref == 'refs/heads/main'
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          publish: pnpm release
          title: V2 Version Packages
          branch: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fixup package.json files
        run: pnpm run release.fixup-package-json

      - name: Commit Build Artifacts
        if: github.event_name == 'push'
        env:
          QWIK_API_TOKEN_GITHUB: ${{ secrets.QWIK_API_TOKEN_GITHUB }}
        run: pnpm run qwik-push-build-repos

  ############ PKG.PR.NEW (decoupled from tests) ############
  release-pkg-pr-new:
    name: Release pkg.pr.new
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    needs:
      - build
      - build-bindings

    # Publish previews as soon as the build is ready, regardless of test status.
    if: |
      !cancelled() &&
      github.repository == 'QwikDev/qwik' &&
      github.event_name != 'workflow_dispatch' &&
      needs.build.result == 'success' &&
      needs.build-bindings.result == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/built-checkout
        with:
          node-version: 24.x

      - name: Fixup package.json files
        run: pnpm run release.fixup-package-json

      - name: Publish packages for testing
        # TODO: bring back --compact in the package.json release.pkg-pr-new script after first npm public of V2 alpha
        run: pnpm release.pkg-pr-new
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ############ TRIGGER QWIKKROUTER E2E TEST ############
  trigger-qwikrouter-e2e:
    name: Trigger Qwik Router E2E
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/upcoming'

    needs:
      - release

    steps:
      - name: Repository Dispatch
        uses: peter-evans/repository-dispatch@bf47d102fdb849e755b0b0023ea3e81a44b6f570 # v2
        with:
          token: ${{ secrets.QWIK_API_TOKEN_GITHUB }}
          repository: QwikDev/qwik-city-e2e
          event-type: main-updated

  ############ Everything is fine ############
  requirements-passed:
    name: All requirements are met
    runs-on: ubuntu-latest
    needs:
      - plan
      - build
      - build-bindings
      - build-docs
      - check
      - check-docs
      - test-unit
      - test-e2e
      - test-cli-e2e
    if: always()
    steps:
      # Skipped is fine: there was nothing to do.
      - name: check status
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
