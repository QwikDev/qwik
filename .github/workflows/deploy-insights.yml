name: Deploy Insights

on:
  push:
    branches: [v1]
    paths:
      - 'packages/insights/**'
      - 'packages/qwik/**'
      - 'packages/qwik-city/**'
      - 'packages/qwik-labs/**'
      - 'packages/eslint-plugin-qwik/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-insights.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qwik-insights-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'QwikDev/qwik' && github.ref == 'refs/heads/v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace dependencies
        run: pnpm build --qwik --qwikcity --qwiklabs --eslint --tsc --platform-binding-wasm-copy --set-dist-tag release
      - name: Verify histogram aggregation
        run: pnpm -C packages/insights exec vitest run src/db/query-helpers.unit.ts
      - name: Build Insights
        run: pnpm -C packages/insights build
      - name: Deploy Insights to Cloudflare Workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm -C packages/insights run deploy
