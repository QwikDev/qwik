[workspace]

members = [
    "packages/optimizer/napi",
    "packages/optimizer/wasm",
    "packages/optimizer/core",
]
# e2e apps own their native$ crates and the generated project; neither is ours to build
exclude = ["packages/optimizer/wasm", "e2e/qwik-e2e", "packages/compiler/generators/rust/ssr"]
resolver = "2"

[profile.release]
debug = 0
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
