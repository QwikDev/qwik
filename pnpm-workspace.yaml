packages:
  - packages/*
  - e2e/*

autoInstallPeers: false

engineStrict: true

supportedArchitectures:
  cpu:
    - current
    - wasm32
  os:
    - current
    - any
  libc:
    - current
    - any

peerDependencyRules:
  allowedVersions:
    eslint-plugin-import>eslint: '10'
  ignoreMissing:
    - '@builder.io/qwik'
    - '@builder.io/qwik-city'

# Speeds up things and fixes CI for pkg.pr.new (workspace version vs string)
verifyDepsBeforeRun: false

allowBuilds:
  '@parcel/watcher': true
  '@rolldown/browser': true
  '@tailwindcss/oxide': true
  esbuild: true
  netlify-cli: true
  puppeteer: true
  sharp: true
  simple-git-hooks: true
  spawn-sync: true
  workerd: true

ignoredOptionalDependencies:
  - unix-dgram

overrides:
  '@builder.io/qwik': link:./packages/qwik
  '@builder.io/qwik-city': link:./packages/qwik-router
  '@fastify/static': 10.1.2
  adm-zip: 0.6.1
  body-parser@1: 1.20.9
  body-parser@2: 2.4.0
  brace-expansion@1: 1.1.21
  brace-expansion@2: 2.1.7
  brace-expansion@5: 5.0.12
  dompurify: 3.4.17
  esbuild@<0.25.0: 0.25.12
  esbuild@>=0.27.3 <0.28.1: 0.28.2
  fast-uri: 3.1.9
  fastify: 5.12.7
  find-my-way: 9.7.0
  follow-redirects: 1.16.1
  js-yaml@3: 3.15.2
  js-yaml@4: 4.3.2
  lodash: 4.18.1
  minimatch@10: 10.2.6
  minimatch@9: 9.0.9
  proxy-addr: 2.0.8
  qs: 6.16.1
  sharp: 0.35.5
  shell-quote: 1.12.0
  smol-toml: 1.9.1
  source-map-js: 1.2.2
  tar: 7.5.22
  tmp: 0.2.7
  toml: 5.0.1
  typescript: 5.9.3
  undici@6: 6.29.1
  undici@7: 7.30.1
  uuid@11: 11.1.1
  uuid@13: 13.0.1
  uuid@8: 11.1.1
  ws@8: 8.21.3
  zod@4: 4.6.7

patchedDependencies:
  density-clustering@1.3.0: patches/density-clustering@1.3.0.patch
  domino@2.1.6: patches/domino@2.1.6.patch
  extract-zip@2.0.1: patches/extract-zip@2.0.1.patch

shellEmulator: true
